services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-superset}
      POSTGRES_USER: ${POSTGRES_USER:-superset}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - superset_postgres_data:/var/lib/postgresql/data
      - ./sample-data/postgres-init.sql:/docker-entrypoint-initdb.d/10-poc.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-changeme}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: poc_mysql
      MYSQL_USER: ${MYSQL_USER:-superset_data}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-mysql-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-mysql-root-change-me}
    volumes:
      - superset_mysql_data:/var/lib/mysql
      - ./sample-data/mysql-init.sql:/docker-entrypoint-initdb.d/10-poc.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 30

  superset-init:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SUPERSET_VERSION: ${SUPERSET_VERSION:-4.1.1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      POSTGRES_DB: ${POSTGRES_DB:-superset}
      POSTGRES_USER: ${POSTGRES_USER:-superset}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-changeme}
      TALISMAN_ENABLED: ${TALISMAN_ENABLED:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_FIRSTNAME: ${ADMIN_FIRSTNAME:-Admin}
      ADMIN_LASTNAME: ${ADMIN_LASTNAME:-User}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py
      - ./init.sh:/init.sh
      - ./sample-data:/app/sample-data:ro
      - superset_home:/app/superset_home
    healthcheck:
      disable: true
    command: ["/bin/bash", "/init.sh"]

  superset:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SUPERSET_VERSION: ${SUPERSET_VERSION:-4.1.1}
    restart: unless-stopped
    depends_on:
      superset-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      POSTGRES_DB: ${POSTGRES_DB:-superset}
      POSTGRES_USER: ${POSTGRES_USER:-superset}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-changeme}
      TALISMAN_ENABLED: ${TALISMAN_ENABLED:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      MYSQL_USER: ${MYSQL_USER:-superset_data}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-mysql-change-me}
      MYSQL_HOST: mysql
      MYSQL_DATABASE: poc_mysql
      SUPERSET_WEBSERVER_TIMEOUT: "300"
      GUNICORN_TIMEOUT: "300"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py
      - ./sample-data:/app/sample-data:ro
      - superset_home:/app/superset_home
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    command: >
      gunicorn --bind 0.0.0.0:8088 --workers 2 --max-requests 1000
      --max-requests-jitter 100 --timeout 300 --graceful-timeout 300
      --keep-alive 10 --limit-request-line 0 --limit-request-field_size 0
      --access-logfile - --error-logfile - "superset.app:create_app()"

volumes:
  superset_postgres_data:
  superset_home:
  superset_mysql_data:
